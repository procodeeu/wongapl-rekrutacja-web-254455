name: E2E Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run build
      - run: npm run test || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: playwright-report/

      - name: Deploy report to Cloudflare
        if: always()
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: procodeeu-wongapl-rekrutacja-web-254455-e2e
          directory: playwright-report

      - name: Comment PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const reportUrl = 'https://procodeeu-wongapl-rekrutacja-web-254455-e2e.pages.dev';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `##  E2E Test Report\n\n **Test Report**: ${reportUrl}\n\n${process.env.TEST_RESULT || 'Tests completed'}`
            });
